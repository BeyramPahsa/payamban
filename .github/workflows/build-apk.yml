name: ساخت فایل نصبی اپ

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: گرفتن کدها
        uses: actions/checkout@v5

      - name: آماده‌سازی جاوا ۱۷
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی اندروید SDK
        uses: android-actions/setup-android@v3

      # Gradle مستقیماً نصب می‌شود تا به فایل gradle-wrapper.jar نیازی نباشد
      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: بررسی فایل‌های پروژه
        run: |
          echo "--- ریشهٔ پروژه ---"
          ls -la
          echo "--- فایل‌های کد ---"
          find app/src -type f | sort
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            [ -f "$f" ] || { echo "::error::فایل ضروری پیدا نشد: $f"; exit 1; }
          done
          echo "همهٔ فایل‌های ضروری موجودند."

      - name: ساخت APK
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: خلاصهٔ خطاها
        if: failure()
        run: |
          echo "=============== خطاهای کامپایل ==============="
          grep -E "^(e: |error: |FAILURE|\* What went wrong|Caused by)" -A2 build.log | head -120 || true
          echo "=============== انتهای گزارش ==============="
          tail -60 build.log || true

      - name: بارگذاری گزارش کامل ساخت
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: نام‌گذاری فایل خروجی
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/payamban.apk
          ls -lh out

      - name: بارگذاری فایل نصبی
        uses: actions/upload-artifact@v4
        with:
          name: payamban-apk
          path: out/payamban.apk

      - name: انتشار نسخه برای دانلود مستقیم
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" out/payamban.apk \
            --title "پیام‌بان $TAG" \
            --notes "فایل نصبی اندروید. روی گوشی دانلود و نصب کنید." \
            || gh release upload "$TAG" out/payamban.apk --clobber
