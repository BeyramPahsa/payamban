name: ساخت فایل نصبی اپ

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: گرفتن کدها
        uses: actions/checkout@v5

      # اگر پوشهٔ app آپلود نشده باشد، از فایل app-source.b64 بازسازی می‌شود
      - name: بازسازی کدها در صورت نیاز
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "پوشهٔ app موجود است."
          elif [ -f app-source.b64 ]; then
            echo "پوشهٔ app نیست — از app-source.b64 بازسازی می‌شود."
            base64 -d app-source.b64 > app-source.tgz
            GOT=$(sha256sum app-source.tgz | cut -d' ' -f1)
            WANT="d36aeb327066a645e9a9fc9ebb702f8dcf2a31917cfc41dd24cfcef2f872e425"
            if [ "$GOT" != "$WANT" ]; then
              echo "::error::فایل app-source.b64 ناقص یا خراب است. احتمالاً هنگام کپی، بخشی از متن جا افتاده. دوباره کل فایل را کپی کنید."
              exit 1
            fi
            tar -xzf app-source.tgz
            rm -f app-source.tgz
            echo "بازسازی انجام شد."
          else
            echo "::error::نه پوشهٔ app هست و نه فایل app-source.b64. یکی از این دو باید در مخزن باشد."
            exit 1
          fi

      - name: بررسی فایل‌های پروژه
        run: |
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            [ -f "$f" ] || { echo "::error::فایل ضروری پیدا نشد: $f"; exit 1; }
          done
          echo "تعداد فایل‌های کد: $(find app/src -type f | wc -l)"

      - name: آماده‌سازی جاوا ۱۷
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: ساخت APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: خلاصهٔ خطاها
        if: failure()
        run: |
          echo "=============== خطاهای کامپایل ==============="
          grep -E "^(e: |error: |FAILURE|\* What went wrong|Caused by)" -A2 build.log | head -120 || true
          echo "=============== انتهای گزارش ==============="
          tail -60 build.log || true

      - name: بارگذاری گزارش کامل ساخت
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: نام‌گذاری فایل خروجی
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/payamban.apk
          ls -lh out

      - name: بارگذاری فایل نصبی
        uses: actions/upload-artifact@v4
        with:
          name: payamban-apk
          path: out/payamban.apk

      - name: انتشار نسخه برای دانلود مستقیم
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" out/payamban.apk \
            --title "پیام‌بان $TAG" \
            --notes "فایل نصبی اندروید. روی گوشی دانلود و نصب کنید." \
            || gh release upload "$TAG" out/payamban.apk --clobber
